$kind: http-request
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Budi Santoso",
      "email": "{{email}}",
      "phone": "{{phone}}",
      "password": "{{password}}",
      "confirm_password": "{{password}}",
      "accept_terms": true
    }
scripts:
  - type: afterResponse
    code: pm.test('status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
