$kind: http-request
url: "{{base_url}}/api/v1/auth/password/reset"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reset_token": "{{reset_token}}",
      "new_password": "Baru@12345",
      "confirm_password": "Baru@12345"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      if (j.data && j.data.access_token) {
        pm.collectionVariables.set('access_token', j.data.access_token);
        pm.collectionVariables.set('refresh_token', j.data.refresh_token);
      }
    language: text/javascript
order: 3000
