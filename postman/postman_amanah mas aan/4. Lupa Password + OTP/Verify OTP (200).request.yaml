$kind: http-request
url: "{{base_url}}/api/v1/auth/password/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "method": "email",
      "destination": "{{email}}",
      "otp": "{{otp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data; if (d && d.reset_token) pm.collectionVariables.set('reset_token', d.reset_token);
    language: text/javascript
order: 2000
