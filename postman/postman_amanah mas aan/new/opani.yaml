openapi: 3.0.0
info:
  title: Amanah Auth API
  version: 1.0.0
  description: Dokumentasi API untuk sistem autentikasi Amanah (Register, Login Email, Login WhatsApp OTP, Lupa Password, dan Sesi).

servers:
  - url: http://localhost:8080/api/v1
    description: Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan access token JWT dengan format "Bearer <token>"

paths:
  /auth/register:
    post:
      summary: 1. Register User Baru
      description: Mendaftarkan akun user baru menggunakan email dan password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - phone
                - password
                - confirm_password
                - accept_terms
              properties:
                full_name:
                  type: string
                  example: "Devi Meilan"
                email:
                  type: string
                  format: email
                  example: "milan@gmail.com"
                phone:
                  type: string
                  example: "+6281234567890"
                password:
                  type: string
                  format: password
                  example: "Password123!"
                confirm_password:
                  type: string
                  format: password
                  example: "Password123!"
                accept_terms:
                  type: boolean
                  example: true
      responses:
        '201':
          description: Created - User berhasil didaftarkan
        '400':
          description: Bad Request - Validasi payload gagal
        '409':
          description: Conflict - Email atau nomor handphone sudah terdaftar

  /auth/login/email:
    post:
      summary: 2. Login via Email
      description: Masuk ke sistem menggunakan kredensial email dan password untuk mendapatkan access dan refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "milan@gmail.com"
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        '200':
          description: OK - Berhasil login, mengembalikan token akses
        '401':
          description: Unauthorized - Email atau password salah

  /auth/token/refresh:
    post:
      summary: 2b. Refresh Access Token
      description: Meminta access token baru menggunakan refresh token yang masih aktif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: "eyJhGciOiJIUzI1Ni..."
      responses:
        '200':
          description: OK - Access token baru berhasil diterbitkan
        '401':
          description: Unauthorized - Refresh token tidak valid atau sudah kedaluwarsa

  /auth/login/whatsapp/request-otp:
    post:
      summary: 3a. Request OTP WhatsApp
      description: Mengirimkan kode OTP verifikasi login ke nomor WhatsApp user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+6281234567890"
      responses:
        '200':
          description: OK - Kode OTP berhasil dikirim via WhatsApp
        '404':
          description: Not Found - Nomor WhatsApp tidak terdaftar

  /auth/login/whatsapp/verify-otp:
    post:
      summary: 3b. Verify OTP WhatsApp
      description: Memverifikasi kode OTP WhatsApp untuk menyelesaikan proses login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "+6281234567890"
                otp:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: OK - OTP valid, berhasil login dan mendapatkan token
        '400':
          description: Bad Request - OTP salah atau sudah kedaluwarsa

  /auth/forgot-password/request-otp:
    post:
      summary: 4a. Lupa Password - Request OTP
      description: Meminta pengiriman kode OTP pemulihan password ke email user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "milan@gmail.com"
      responses:
        '200':
          description: OK - Email instruksi/OTP pemulihan password terkirim
        '404':
          description: Not Found - Email tidak ditemukan di sistem

  /auth/forgot-password/reset:
    post:
      summary: 4b. Lupa Password - Reset Password Baru
      description: Mengubah password lama dengan password baru menggunakan kode OTP pemulihan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - new_password
                - confirm_password
              properties:
                email:
                  type: string
                  format: email
                  example: "milan@gmail.com"
                otp:
                  type: string
                  example: "123456"
                new_password:
                  type: string
                  format: password
                  example: "NewPassword123!"
                confirm_password:
                  type: string
                  format: password
                  example: "NewPassword123!"
      responses:
        '200':
          description: OK - Password berhasil direset
        '400':
          description: Bad Request - OTP salah/kedaluwarsa atau konfirmasi password tidak cocok

  /auth/session/me:
    get:
      summary: 5a. Cek Session User (Get Profile)
      description: Mengambil informasi data profil user yang sedang aktif berdasarkan token autentikasi.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK - Mengembalikan data profil user
        '401':
          description: Unauthorized - Token tidak valid atau tidak disertakan

  /auth/session/logout:
    post:
      summary: 5b. Logout Session
      description: Menghapus atau mencabut sesi aktif (menghancurkan token/refresh token di server).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK - Berhasil logout
        '401':
          description: Unauthorized - Token tidak valid atau tidak disertakan

/health:
    get:
      summary: 0. Health check
      description: Memeriksa apakah server API sedang aktif dan berjalan dengan baik.
      responses:
        '200':
          description: OK - Server aktif

          paths:
/health:
    get:
      summary: 0. Health check
      description: Memeriksa apakah server API sedang aktif dan berjalan dengan baik.
      responses:
        '200':
          description: OK - Server aktif

